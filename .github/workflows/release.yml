name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify tag version matches code and scripts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Release tag version: $tag"
          $pyproject = (Get-Content pyproject.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          Write-Host "pyproject.toml version: $pyproject"
          $ps1 = (Get-Content install.ps1 | Select-String '^\$Version = ''(.*)''').Matches.Groups[1].Value
          Write-Host "install.ps1 version: $ps1"
          $sh = (Get-Content install.sh | Select-String '^VERSION="(.*)"').Matches.Groups[1].Value
          Write-Host "install.sh version: $sh"

          if ($tag -ne $pyproject -or $tag -ne $ps1 -or $tag -ne $sh) {
            Write-Error "Version mismatch: Tag ($tag) vs pyproject ($pyproject) vs ps1 ($ps1) vs sh ($sh)"
            exit 1
          }

      - name: Install dev dependencies
        run: uv sync --locked --python 3.12

      - name: Run validation checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

      - name: Build distributions
        run: uv build

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist/* | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          prerelease: true
          generate_release_notes: true

