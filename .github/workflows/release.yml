name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify tag version matches code and scripts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Release tag version: $tag"
          $pyproject = (Get-Content pyproject.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          Write-Host "pyproject.toml version: $pyproject"
          $init = (Get-Content src/deskflow/__init__.py | Select-String '__version__: str = "(.*)"').Matches.Groups[1].Value
          Write-Host "src/deskflow/__init__.py version: $init"
          $ps1 = (Get-Content install.ps1 | Select-String '^\$Version = ''(.*)''').Matches.Groups[1].Value
          Write-Host "install.ps1 version: $ps1"
          $sh = (Get-Content install.sh | Select-String '^VERSION="(.*)"').Matches.Groups[1].Value
          Write-Host "install.sh version: $sh"

          if ($tag -ne $pyproject -or $tag -ne $init -or $tag -ne $ps1 -or $tag -ne $sh) {
            Write-Error "Version mismatch: Tag ($tag) vs pyproject ($pyproject) vs init ($init) vs ps1 ($ps1) vs sh ($sh)"
            exit 1
          }

      - name: Verify bundled model provenance for production release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Pre-release tags contain a hyphen, e.g. v0.1.0-rc1, v0.1.0-alpha, v0.1.0-dev
          $isPreRelease = $tag.Contains("-")
          $cardPath = "src/deskflow/data/models/default/model_card.json"
          if (Test-Path $cardPath) {
            $card = Get-Content $cardPath | ConvertFrom-Json
            if ($card.synthetic -eq $true -and -not $isPreRelease) {
              Write-Error "Production release ($tag) rejected: bundled model card specifies synthetic: true. Real dataset training required for final releases."
              exit 1
            }
          }

      - name: Install dev dependencies
        run: uv sync --locked --python 3.12

      - name: Run validation checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run deskflow tools verify

      - name: Build distributions
        run: uv build

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist/* | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

