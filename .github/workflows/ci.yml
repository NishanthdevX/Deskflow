name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: "Check / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest

  install-smoke:
    name: "Install Smoke / ${{ matrix.os }}"
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Run installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-Item dist/*.whl).FullName
          $env:DESKFLOW_WHEEL = $wheel
          $env:DESKFLOW_ARGS = "--version"
          powershell -File install.ps1
          $env:DESKFLOW_ARGS = "doctor"
          powershell -File install.ps1

      - name: Run installer smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          WHEEL=$(ls dist/*.whl)
          export DESKFLOW_WHEEL="$WHEEL"
          export DESKFLOW_ARGS="--version"
          bash install.sh
          export DESKFLOW_ARGS="doctor"
          bash install.sh

